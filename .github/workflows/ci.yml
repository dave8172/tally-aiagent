name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,mcp]"
      - name: Tests
        run: pytest -q
      - name: The MCP server must actually import
        # A local venv holding a pinned version will hide a broken dependency
        # declaration. Import it on a fresh resolve, every time.
        run: python -c "from tally_aiagent import mcp_server; print(mcp_server.server.name)"
      - name: The CLI must actually run
        run: tally-aiagent --help
