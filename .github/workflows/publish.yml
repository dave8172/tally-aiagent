name: publish

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write        # OIDC trusted publishing — no API token anywhere
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,mcp]" build twine
      - name: Tests must pass before anything is uploaded
        run: pytest -q
      - name: Build
        run: python -m build
      - name: Check metadata
        run: twine check dist/*
      - uses: pypa/gh-action-pypi-publish@release/v1
